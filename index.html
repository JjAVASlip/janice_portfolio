<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Janice Mas Bulanon - 3rd Year BSIT Student Portfolio at National College of Science and Technology. Specializing in Systems Analysis, Workflow Design, QA, UI/UX, and Web Technologies." />

  <title>Janice Mas Bulanon | BSIT Candidate • Systems & Design Portfolio</title>

  <!-- Google Fonts: Sora, Inter, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Libraries -->
  <script src="Vue.js/vue-app/js/Vue.js"></script>
  <script src="Vue.js/vue-app/js/VueRouter.js"></script>
  <script src="Vue.js/vue-app/js/tailwindcss.js"></script>

  <!-- Tailwind Configuration -->
  <script src="js/tailwind.config.js"></script>

  <!-- Custom Global Styles & Animation Directives -->
  <style type="text/tailwindcss">
    @layer base {
      html {
        font-family: 'Sora', 'Inter', sans-serif;
        background-color: #060810;
        color: #F5F3EE;
      }
      body {
        overflow-x: hidden;
      }
      ::selection {
        background-color: #D4AF37;
        color: #060810;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #060810;
    }
    ::-webkit-scrollbar-thumb {
      background: #1B2640;
      border-radius: 4px;
      border: 2px solid #060810;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D4AF37;
    }

    /* Vue Transitions */
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.3s ease;
    }
    .fade-enter-from, .fade-leave-to {
      opacity: 0;
    }

    .fade-loader-enter-active, .fade-loader-leave-active {
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-loader-enter-from, .fade-loader-leave-to {
      opacity: 0;
      transform: scale(1.02);
    }

    .modal-fade-enter-active, .modal-fade-leave-active {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .modal-fade-enter-from, .modal-fade-leave-to {
      opacity: 0;
      transform: scale(0.97);
    }

    .slide-fade-enter-active, .slide-fade-leave-active {
      transition: all 0.3s ease-out;
    }
    .slide-fade-enter-from, .slide-fade-leave-to {
      transform: translateY(-10px);
      opacity: 0;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-bgPrimary font-sora text-primaryText antialiased selection:bg-gold selection:text-bgPrimary">

  <div id="app"></div>

</body>
